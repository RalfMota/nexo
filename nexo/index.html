<body>
  <div id="app"></div>

  <noscript>O NEXO precisa de JavaScript ativado para funcionar.</noscript>

  <!-- Módulos JavaScript não carregam com o arquivo aberto direto (file://): é preciso um servidor local. -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="screen"><main class="screen__content"><div class="frame" style="max-width:560px">' +
        '<h2>Abra o NEXO por um servidor local</h2>' +
        '<p>O jogo usa módulos JavaScript, que o navegador bloqueia quando o arquivo é aberto direto da pasta.</p>' +
        '<p><b>No VS Code:</b> abra a pasta <code>nexo</code> (Arquivo &gt; Abrir Pasta), clique com o botão direito em <code>index.html</code> e escolha <b>Open with Live Server</b>.</p>' +
        '<p>Mais opções no arquivo <code>README.md</code>.</p></div></main></div>';
    }
  </script>
  <script type="module" src="js/main.js"></script>
